server {
    listen 80;
    server_name jps-auto-find.com www.jps-auto-find.com;

    client_max_body_size 50m;
    auth_basic "JPS Auto Find";
    auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter;

    location = /api/auth/me {
        default_type application/json;
        return 200 '{"username":"$remote_user"}';
    }

    location = /settings {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /settings/ {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /foundation {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /foundation/ {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/settings {
        proxy_pass http://127.0.0.1:8000/api/settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET {
            auth_basic "JPS Auto Find Admin";
            auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;
        }
    }

    location ^~ /api/settings/ {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:8000/api/settings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        auth_basic "JPS Auto Find Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-hunter-admin;

        proxy_pass http://127.0.0.1:8000/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ai-hunter-api-key.conf;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
